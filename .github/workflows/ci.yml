# Keep the GPUMD-PySAGES interface working against the latest GPUMD master.
#
# GPUMD-PySAGES works by patching a few GPUMD core files (gpumd_patches/) and
# adding a pybind11 wrapper. Whenever GPUMD is refactored upstream, those
# patches and the wrapper can silently stop compiling. These checks make that
# breakage visible immediately instead of leaving users with a build error.
#
# Checks:
#   1. build-extension   - compiles gpumd.so against the latest GPUMD master
#                         (the important one: upstream GPUMD API drift)
#   2. python-api-compat - imports the PySAGES backend against the current
#                         PySAGES and JAX, so that upstream PySAGES/JAX API
#                         changes are caught here and not on a user's machine
#
# Both run on standard GitHub runners. No GPU is required: the first job only
# compiles (nvcc runs on the CPU) and the second only imports, so neither runs
# a simulation.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Weekly on Sunday 03:00 UTC - catches upstream drift before users hit it
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extension:
    name: Build gpumd.so against GPUMD master
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates g++ git make pkg-config \
            python3 python3-dev python3-pip binutils file
          pip3 install --no-cache-dir pybind11

      - name: Clone GPUMD master
        run: git clone --depth 1 https://github.com/brucefan1983/GPUMD.git $HOME/GPUMD

      - name: Checkout GPUMD-PySAGES
        uses: actions/checkout@v4
        with:
          path: GPUMD-PySAGES

      - name: Build the extension (compile only, no Python backend install)
        run: |
          SKIP_PYTHON_INSTALL=1 MAKE_JOBS=2 \
            ./GPUMD-PySAGES/build.sh $HOME/GPUMD

      - name: Verify gpumd.so
        run: |
          test -f $HOME/GPUMD/src/gpumd.so
          file $HOME/GPUMD/src/gpumd.so
          # Python imports the module by looking for PyInit_gpumd, so its
          # presence proves this is a valid, importable extension module.
          nm -D --defined-only $HOME/GPUMD/src/gpumd.so | grep -q "PyInit_gpumd"
          echo "PyInit_gpumd exported: gpumd.so is a valid extension module."

  python-api-compat:
    name: Check PySAGES and JAX API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm needs real git metadata to resolve the version.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check all Python files
        run: |
          python -m py_compile \
            setup.py \
            gpumd_pysages/__init__.py \
            gpumd_pysages/install.py \
            pysages_backend/gpumd.py \
            examples/diagnose_timing.py \
            examples/ethane-metad.py
          echo "All Python files compile."

      - name: Install PySAGES and JAX
        # PySAGES is not published on PyPI; it is installed from GitHub, which is
        # what the README instructs users to do as well. The default branch is
        # what `git clone` gives a user, so test against that.
        run: |
          python -m pip install --upgrade pip
          pip install "jax>=0.4.0"
          pip install "git+https://github.com/SSAGESLabs/PySAGES.git"

      # Importing the backend executes every "from pysages.../from jax..."
      # import at its top level, so a renamed or moved upstream symbol fails
      # here instead of at runtime on a user's machine.
      - name: Import backend against PySAGES
        run: |
          python -c "import sys; sys.path.insert(0, 'pysages_backend'); import gpumd; print('backend imports OK against PySAGES:', gpumd.__file__)"

      - name: Verify the backend installs into PySAGES
        run: |
          pip install --no-deps -e .
          python -m gpumd_pysages.install < /dev/null
          python - <<'PY'
          import os
          import pysages
          dst = os.path.join(os.path.dirname(pysages.__file__), "backends", "gpumd.py")
          assert os.path.exists(dst), f"backend not installed at {dst}"
          print("GPUMD backend installed into PySAGES:", dst)
          PY
